<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Abrindo o grupo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script>
    (function () {
      var id = window.SITE && window.SITE.metaPixelId;
      if (!id) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', id);
      fbq('track', 'PageView');
      // Conversão que o Meta Ads otimiza: pessoa chegou ao convite do grupo
      fbq('track', 'Lead');
    })();
  </script>
</head>
<body>
  <div class="centro">
    <main>
      <h1>Abrindo o grupo</h1>
      <p>Você será levada ao WhatsApp em instantes.</p>
      <a class="btn" id="ir" href="/go">Abrir agora</a>
    </main>
  </div>

  <script>
    (function () {
      var destino = '/go' + window.location.search;
      document.getElementById('ir').href = destino;
      // Pequena espera para o pixel registrar o Lead antes do redirecionamento
      setTimeout(function () { window.location.replace(destino); }, 1200);
    })();
  </script>
</body>
</html>
